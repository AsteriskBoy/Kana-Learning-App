<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme-init.js"></script>
  <script src="accent.js"></script>
  <script src="pixel-theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese Kana</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { display: none; }

    /* ══ Theme Variables ══ */
    :root {
      --paper: #f8f5ee;
      --ink: #141210;
      --ink-soft: #383028;
      --gold: #7d5a0c;
      --vermillion: #b83224;
      --tile-border: #dcd3c4;
      --tile-bg: #ffffff;
      --btn-no-bg: #ffffff;
      --btn-no-color: #383028;
      --btn-no-border: #dcd3c4;
      --corner-color: #8a6a2a;
      --corner-opacity: 0.22;
      --bg-image: url("assets/fuji-light.jpg");
      --bg-opacity: 0.28;
    }

    body.dark {
      --paper: #13100e;
      --ink: #e8e0d5;
      --ink-soft: #c4b8a8;
      --gold: #c9a84c;
      --vermillion: #e05a47;
      --tile-border: #3a3028;
      --tile-bg: #1e1a17;
      --btn-no-bg: #1e1a17;
      --btn-no-color: #c4b8a8;
      --btn-no-border: #3a3028;
      --corner-color: #c9a84c;
      --corner-opacity: 0.25;
      --bg-image: url("assets/fuji-dark.jpg");
      --bg-opacity: 0.35;
    }

    body.light {
      --paper: #f8f5ee;
      --ink: #141210;
      --ink-soft: #383028;
      --gold: #7d5a0c;
      --vermillion: #b83224;
      --tile-border: #dcd3c4;
      --tile-bg: #ffffff;
      --btn-no-bg: #ffffff;
      --btn-no-color: #383028;
      --btn-no-border: #dcd3c4;
      --corner-color: #8a6a2a;
      --corner-opacity: 0.22;
      --bg-image: url("assets/fuji-light.jpg");
      --bg-opacity: 0.28;
    }

    body {
      background-color: var(--paper) !important;
      color: var(--ink) !important;
      font-family: 'Lora', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
      transition: opacity 0.35s ease, background-color 0.25s ease, color 0.25s ease;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      opacity: var(--bg-opacity);
      pointer-events: none; z-index: 0;
      transition: opacity 0.35s ease, background-image 0.35s ease;
    }

    /* Top bar for mode switcher */
    .splash-topbar {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 10;
      -webkit-app-region: no-drag;
    }

    /* Theme toggle switch */
    .tb-theme-toggle {
      display: inline-block;
      position: relative;
      width: 54px;
      height: 26px;
      padding: 0;
      border-radius: 13px;
      cursor: pointer;
      outline: none;
      user-select: none;
      box-sizing: border-box;
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      vertical-align: middle;
    }

    .tb-theme-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      transition: transform 0.28s cubic-bezier(0.34, 1.3, 0.64, 1), background-color 0.25s ease, box-shadow 0.25s ease;
      z-index: 1;
      pointer-events: none;
    }

    .tb-theme-icon {
      position: absolute;
      top: 2px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
      transition: color 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
    }

    .tb-theme-icon.sun {
      left: 2px;
    }

    .tb-theme-icon.moon {
      right: 2px;
    }

    .tb-theme-icon svg {
      width: 13px;
      height: 13px;
      display: block;
      margin: auto;
    }

    /* Light state for toggle */
    body.light .tb-theme-toggle {
      background: #e8dfd0;
      border: 1px solid #d2c5b0;
    }
    body.light .tb-theme-thumb {
      transform: translateX(0);
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(20, 18, 16, 0.22);
    }
    body.light .tb-theme-icon.sun {
      color: #b45309;
      opacity: 1;
      transform: scale(1.05);
    }
    body.light .tb-theme-icon.moon {
      color: #8c7e6e;
      opacity: 0.6;
      transform: scale(0.9);
    }

    /* Dark state for toggle */
    body.dark .tb-theme-toggle {
      background: #231c18;
      border: 1px solid #3d322a;
    }
    body.dark .tb-theme-thumb {
      transform: translateX(28px);
      background: #3a2e26;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
    }
    body.dark .tb-theme-icon.sun {
      color: #6a5a4c;
      opacity: 0.6;
      transform: scale(0.9);
    }
    body.dark .tb-theme-icon.moon {
      color: #ffd166;
      opacity: 1;
      transform: scale(1.05);
    }

    /* Decorative kanji corners - Shifted nicely so they are not cut off */
    .corner {
      position: fixed;
      font-family: 'Shippori Mincho B1', serif;
      font-size: 4.6rem; font-weight: 800;
      color: var(--corner-color) !important;
      opacity: var(--corner-opacity) !important;
      pointer-events: none; z-index: 0; line-height: 1;
      transition: color 0.25s ease, opacity 0.25s ease;
    }
    .corner-tl { top: 18px; left: 18px; }
    .corner-br { bottom: 18px; right: 18px; }

    .wrap {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      padding: 0 32px;
    }

    /* Fade-in animation */
    .wrap > * {
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }
    .kana-hero  { animation-delay: 0.1s; }
    .divider    { animation-delay: 0.3s; }
    .question   { animation-delay: 0.45s; }
    .sub        { animation-delay: 0.55s; }
    .buttons    { animation-delay: 0.7s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .kana-hero {
      font-family: 'Shippori Mincho B1', serif;
      font-size: 1.6rem; font-weight: 800;
      color: var(--ink) !important;
      letter-spacing: 0.2em;
      margin-bottom: 2px;
      line-height: 1.2;
    }

    .divider {
      width: 40px; height: 1px;
      background: var(--vermillion) !important;
      margin: 12px auto 16px;
      position: relative; opacity: 0.8;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--vermillion) !important;
    }
    .divider::before { left: -6px; }
    .divider::after  { right: -6px; }

    .question {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--ink) !important;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .sub {
      font-size: 0.75rem;
      font-style: italic;
      color: var(--gold) !important;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      -webkit-app-region: no-drag;
    }

    .btn {
      padding: 10px 24px;
      border-radius: 7px;
      font-family: 'Lora', serif;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      border: none;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: scale(0.97); }

    .btn-yes {
      background: var(--vermillion) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 16px rgba(var(--vermillion-rgb), 0.3);
    }
    .btn-yes:hover { box-shadow: 0 6px 22px rgba(var(--vermillion-rgb), 0.45); }

    .btn-no {
      background: var(--btn-no-bg) !important;
      color: var(--btn-no-color) !important;
      border: 1px solid var(--btn-no-border) !important;
      box-shadow: 0 2px 8px rgba(20, 18, 16, 0.06);
    }
    .btn-no:hover {
      border-color: var(--vermillion) !important;
      color: var(--vermillion) !important;
    }

    @keyframes shake {
      0%,100%{ transform: translateX(0); }
      20%    { transform: translateX(-6px); }
      40%    { transform: translateX(6px); }
      60%    { transform: translateX(-4px); }
      80%    { transform: translateX(4px); }
    }
    .btn-no.shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>

  <div class="splash-topbar">
    <button type="button" class="tb-theme-toggle" id="theme-toggle-btn" role="switch" aria-label="Toggle light or dark mode">
      <span class="tb-theme-thumb"></span>
      <span class="tb-theme-icon sun" title="Light mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </span>
      <span class="tb-theme-icon moon" title="Dark mode">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
  </div>

  <span class="corner corner-tl">仮</span>
  <span class="corner corner-br">名</span>

  <div class="wrap">
    <div class="kana-hero">ひらがな · カタカナ</div>
    <div class="divider"></div>
    <h1 class="question">Are you determined to learn?</h1>
    <p class="sub">頑張る気持ちはありますか？</p>
    <div class="buttons">
      <button class="btn btn-yes" id="btn-yes">Haiii~!! 🌸</button>
      <button class="btn btn-no"  id="btn-no">iie ~ :(</button>
    </div>
  </div>

  <script>
    // Theme toggle handling on splash
    (function () {
      function getTheme() {
        const stored = localStorage.getItem('kana-theme');
        if (stored === 'light' || stored === 'dark') return stored;
        const dm = localStorage.getItem('dm');
        if (dm === '1') return 'dark';
        if (dm === '0') return 'light';
        return 'light';
      }

      function apply(theme) {
        const next = theme === 'dark' ? 'dark' : 'light';
        localStorage.setItem('kana-theme', next);
        localStorage.setItem('dm', next === 'dark' ? '1' : '0');
        document.documentElement.setAttribute('data-theme', next);
        document.documentElement.style.background = next === 'light' ? '#f8f5ee' : '#13100e';
        document.body.classList.toggle('dark', next === 'dark');
        document.body.classList.toggle('light', next === 'light');

        // Remove early boot style so it never interferes with CSS variables
        const boot = document.getElementById('kana-theme-boot');
        if (boot) boot.remove();

        const btn = document.getElementById('theme-toggle-btn');
        if (btn) {
          btn.setAttribute('title', next === 'light' ? 'Current: Light Mode (Sun) — Click to switch to Dark Mode (Moon)' : 'Current: Dark Mode (Moon) — Click to switch to Light Mode (Sun)');
          btn.setAttribute('aria-checked', next === 'light' ? 'false' : 'true');
        }
      }

      apply(getTheme());

      document.getElementById('theme-toggle-btn').addEventListener('click', () => {
        apply(getTheme() === 'light' ? 'dark' : 'light');
      });
    })();

    // Playful shake animation for iie button
    document.getElementById('btn-no').addEventListener('click', () => {
      const btn = document.getElementById('btn-no');
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
      btn.textContent = 'Gambatte!! 💪';
      setTimeout(() => { btn.textContent = 'iie ~ :('; }, 1200);
    });

    // Haiii button — smooth immediate transition into main app
    document.getElementById('btn-yes').addEventListener('click', () => {
      document.body.style.opacity = '0';

      setTimeout(() => {
        if (window.electronAPI) {
          window.electronAPI.enterApp();
        } else {
          location.href = 'index.html'; // browser fallback
        }
      }, 300);
    });
  </script>

  <script src="keys.js"></script>
</body>
</html>
